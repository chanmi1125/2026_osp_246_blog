{% comment %} 테마의 목차 영역을 덮어쓴 파일입니다. (제목을 한국어로) {% endcomment %}
{% if page.toc %}
<div class="toc-wrapper">
  <h2 class="toc-title">목차</h2>
  <nav class="toc-nav">
    {% include toc.html html=content h_min=2 h_max=3 skipNoIDs=true class="toc" %}
  </nav>
</div>
{% endif %}
{% if page.toc %}
<script>
  // 스크롤 위치에 맞춰 현재 읽고 있는 소제목을 목차에서 강조
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('.toc-nav a[href^="#"]'));
    if (!links.length) return;
    var heads = links.map(function (a) { return document.getElementById(decodeURIComponent(a.hash.slice(1))); });
    function update() {
      var idx = 0;
      heads.forEach(function (h, i) { if (h && h.getBoundingClientRect().top < 120) idx = i; });
      links.forEach(function (a, i) { a.classList.toggle('is-active', i === idx); });
    }
    window.addEventListener('scroll', update, { passive: true });
    document.addEventListener('scroll', update, { passive: true, capture: true });
    update();
  })();
</script>
{% endif %}
